name: CLA

# Asks each first-time contributor to sign CLA.md on their pull request and
# records the signature; a PR from someone who has not signed stays blocked
# until they comment the sentence below. Signatures live in this repository
# on the `cla-signatures` branch, so no extra token is needed.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # A PR a bot opens is skipped: Dependabot's runs get a read-only token and could only fail here.
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || (github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/stuga-dev/stuga/blob/main/CLA.md"
          branch: "cla-signatures"
          # Exact logins: a pattern with * matches anywhere in a name, so bot* let "abbott" skip the CLA.
          allowlist: dependabot[bot],github-actions[bot]
