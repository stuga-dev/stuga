name: Vulnerability watch

# Daily: the latest release scanned again with today's advisories, and the pins no scanner reads
# compared with their upstreams. scripts/vuln-gate.mjs --issues keeps one issue per finding, with
# public advisory IDs only, assigned to the SECURITY_OWNER variable. A failed run emails whoever
# last changed the schedule.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vuln-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      # main's gate and exceptions; the release's own lockfile and pins, checked out beside them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        name: The latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::watching $tag"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release
          persist-credentials: false
      # accepted-risks.json is the only ignore list, as CI checks: the release must carry no scanner's own.
      - name: No scanner's own ignore file
        run: |
          found="$(git -C release ls-files -- ':(glob)**/osv-scanner.toml' ':(glob)**/.trivyignore' \
            ':(glob)**/.trivyignore.yaml' ':(glob)**/trivy.yaml' | tr '\n' ' ')"
          if [ -n "$found" ]; then
            echo "::error::.github/security/accepted-risks.json is the only ignore list; the release carries $found"
            exit 1
          fi
      - run: bash scripts/vuln-tools.sh "$RUNNER_TEMP/bin"

      - name: npm packages
        run: |
          : > "$RUNNER_TEMP/osv-scanner.toml"
          "$RUNNER_TEMP/bin/osv-scanner" scan source --config "$RUNNER_TEMP/osv-scanner.toml" --lockfile release/pnpm-lock.yaml \
            --all-packages --format json > "$RUNNER_TEMP/osv.json" || [ $? = 1 ]
      - name: The connector's Go
        run: bash packaging/shared/connector/vulncheck.sh --pins release/packaging/versions.env --out "$RUNNER_TEMP/go"
      - name: Node.js
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/node-core.json" \
            https://raw.githubusercontent.com/nodejs/security-wg/main/vuln/core/index.json

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The release's images
        env:
          TAG: ${{ steps.release.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for img in stuga-node stuga-postgres stuga-remote; do
            for arch in amd64 arm64; do
              "$RUNNER_TEMP/bin/trivy" image --config "" --ignorefile "" --disable-telemetry --skip-version-check \
                --image-src remote --platform "linux/$arch" --scanners vuln \
                --format json --quiet --output "$RUNNER_TEMP/trivy-$img-$arch.json" "ghcr.io/$OWNER/$img:${TAG#v}"
            done
          done

      # Go, the Mac runtime's PostgreSQL and OpenSSL, and the advisories of what Stuga builds on but no
      # scanner reads. A check that cannot finish fails the step, so the watch closes no issue for it.
      - id: pins
        name: Pins no scanner reads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          . release/packaging/versions.env
          items='[]'
          add() { # add <id> <package> <version> <newer> <where> <url>
            items="$(jq -c --arg id "$1" --arg p "$2" --arg v "$3" --arg f "$4" --arg w "$5" --arg u "$6" \
              '. + [{id: $id, package: $p, version: $v, fixed: $f, where: $w, url: $u}]' <<< "$items")"
          }
          go="$(curl -fsSL 'https://go.dev/dl/?mode=json' \
            | jq -r --arg minor "go${GO_VERSION%.*}." 'map(.version | select(startswith($minor))) | first // ""')"
          if [ -z "$go" ]; then
            add "Go-${GO_VERSION%.*}" go "$GO_VERSION" "a supported Go" "the connector" https://go.dev/doc/devel/release
          elif [ "$go" != "go$GO_VERSION" ]; then
            add "Go-${go#go}" go "$GO_VERSION" "${go#go}" "the connector" "https://go.dev/doc/devel/release#$go"
          fi
          need() { # need <what> <value>: a lookup that came back empty fails the step
            [ -n "$2" ] || { echo "::error::$1: nothing found, so the Mac runtime is not watched today"; exit 1; }
          }
          # A release from before the component list has none; one that lists it must be read.
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qx 'stuga-runtime-.*\.cdx\.json' <<< "$assets"; then
            mkdir -p "$RUNNER_TEMP/bom"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'stuga-runtime-*.cdx.json' --dir "$RUNNER_TEMP/bom"
            bom="$(ls "$RUNNER_TEMP"/bom/*.cdx.json)"
            component() { jq -r --arg n "$1" '[.components[] | select(.name == $n) | .version] | first // ""' "$bom"; }
            pg="$(component postgresql)"
            need "PostgreSQL in $(basename "$bom")" "$pg"
            latest="$(curl -fsSL https://www.postgresql.org/versions.json \
              | jq -r --arg major "${pg%%.*}" '.[] | select(.major == $major) | "\(.major).\(.latestMinor)"')"
            need "PostgreSQL ${pg%%.*} at postgresql.org" "$latest"
            if [ "$latest" != "$pg" ]; then
              add "PostgreSQL-$latest" postgresql "$pg" "$latest" "Mac runtime" https://www.postgresql.org/support/security/
            fi
            ssl="$(component openssl)"
            need "OpenSSL in $(basename "$bom")" "$ssl"
            latest="$(git ls-remote --tags https://github.com/openssl/openssl "refs/tags/openssl-${ssl%.*}.*" \
              | sed -n 's|.*refs/tags/openssl-\([0-9.]*\)$|\1|p' | sort -V | tail -1)"
            need "OpenSSL ${ssl%.*} releases" "$latest"
            if [ "$latest" != "$ssl" ]; then
              add "OpenSSL-$latest" openssl "$ssl" "$latest" "Mac runtime" https://openssl-library.org/news/vulnerabilities/
            fi
          else
            echo "::notice::$TAG has no stuga-runtime-*.cdx.json, so the Mac runtime's libraries are not watched"
          fi
          printf '%s\n' "$items" > "$RUNNER_TEMP/watch.json"
          # Every page, each a list: an advisory missing from what was read would close its issue.
          for spec in "frp fatedier/frp $FRP_VERSION" "pg_search paradedb/paradedb $PG_SEARCH_VERSION" \
            "pgvector pgvector/pgvector $PGVECTOR_VERSION" "postgres.app PostgresApp/PostgresApp $POSTGRES_APP_VERSION"; do
            read -r name repo version <<< "$spec"
            gh api --paginate --slurp "repos/$repo/security-advisories?per_page=100" \
              | jq 'if all(type == "array") then add else error("not a list of advisories") end' \
              > "$RUNNER_TEMP/advisories-$name.json"
            echo "--advisories=$name@$version=$RUNNER_TEMP/advisories-$name.json" >> "$RUNNER_TEMP/advisories.args"
          done
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECURITY_OWNER: ${{ vars.SECURITY_OWNER }}
          NODE_VERSION: ${{ steps.pins.outputs.node }}
        run: |
          set -euo pipefail
          mapfile -t advisories < "$RUNNER_TEMP/advisories.args"
          trivy=()
          for f in "$RUNNER_TEMP"/trivy-stuga-{node,postgres,remote}-{amd64,arm64}.json; do trivy+=(--trivy "$f"); done
          node scripts/vuln-gate.mjs --issues --osv "$RUNNER_TEMP/osv.json" --lockfile release/pnpm-lock.yaml \
            --govulncheck "$RUNNER_TEMP/go/govulncheck-frpc-darwin-arm64.json" \
            --govulncheck "$RUNNER_TEMP/go/govulncheck-frpc-linux-amd64.json" \
            --govulncheck "$RUNNER_TEMP/go/govulncheck-frpc-linux-arm64.json" \
            --node-core "$RUNNER_TEMP/node-core.json" --node-version "$NODE_VERSION" \
            "${trivy[@]}" "${advisories[@]}" --watch "$RUNNER_TEMP/watch.json"
