<html lang="zh-Hant"><head><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;line-height:1.45}</style></head>
<body>
<p>Stuga 正在啟動。Stuga 一開始執行，你的瀏覽器就會打開它的設定頁面；如果沒有打開，請按一下選單列中的 Stuga 標誌，然後選擇<b>設定 Stuga…</b>。</p>
<p>如果瀏覽器要求尋找區域網路上的裝置，請選擇<b>允許</b>：瀏覽器需要這樣才能連到 Stuga。</p>
<p>設定完成後，你網路上的其他裝置可以打開選單中顯示的位址。選擇<b>以 QR 碼顯示位址…</b>即可在手機上打開它。</p>
</body></html>
