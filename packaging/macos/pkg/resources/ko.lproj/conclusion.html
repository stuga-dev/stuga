<p>Stuga를 시작하는 중이에요. Stuga가 실행되면 바로 브라우저에서 설정 페이지가 열려요. 열리지 않으면 메뉴 막대의 Stuga 마크에서 <b>Stuga 설정…</b> 항목을 선택하세요.</p>
<p>브라우저가 로컬 네트워크의 기기를 찾도록 허용할지 물으면 <b>허용</b>을 선택하세요. 그래야 브라우저가 Stuga에 연결할 수 있어요.</p>
<p>설정을 마치면 네트워크의 다른 기기에서 메뉴에 표시된 주소를 열 수 있어요. <b>주소를 QR 코드로 표시…</b> 항목을 사용하면 휴대폰에서 열 수 있어요.</p>
</body></html>
