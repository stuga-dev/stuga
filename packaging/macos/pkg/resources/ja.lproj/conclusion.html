<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;line-height:1.45}</style></head>
<body>
<p>Stugaを起動しています。Stugaが動き出すとすぐに、ブラウザーでセットアップページが開きます。開かない場合は、メニューバーのStugaマークから<b>Stuga をセットアップ…</b>を選択してください。</p>
<p>ブラウザーがローカルネットワーク上のデバイスを探す許可を求めてきたら、<b>許可</b>を選択してください。ブラウザーはそうしてStugaにアクセスします。</p>
<p>セットアップが済んだら、ネットワーク上のほかのデバイスからメニューに表示されるアドレスを開けます。<b>アドレスを QR コードで表示…</b>を使うとスマートフォンで開けます。</p>
</body></html>
