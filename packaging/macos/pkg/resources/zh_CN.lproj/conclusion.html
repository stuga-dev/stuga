<html lang="zh-Hans"><head><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif;line-height:1.45}</style></head>
<body>
<p>Stuga 正在启动。Stuga 一运行，你的浏览器就会打开它的设置页面；如果没有打开，请点按菜单栏中的 Stuga 标志，然后选取<b>设置 Stuga…</b>。</p>
<p>如果浏览器请求查找本地网络上的设备，请选择<b>允许</b>：浏览器要这样才能访问 Stuga。</p>
<p>设置完成后，你网络中的其他设备可以打开菜单中显示的地址。选取<b>以二维码显示地址…</b>即可在手机上打开它。</p>
</body></html>
