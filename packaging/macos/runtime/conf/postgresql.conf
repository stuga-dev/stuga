# Stuga's Postgres on a Mac: the whole postgresql.conf, replacing initdb's. init-cluster.sh
# fills every @PLACEHOLDER@; an unreplaced one stops the server rather than running on a guess.
#
#   shared_buffers         held for the life of the server
#   work_mem               per sort or hash node, per statement
#   maintenance_work_mem   per index build; pg_search builds a BM25 index within it, split
#                          among max_parallel_maintenance_workers, and has no budget of its own

# ---- connections: the unix socket and nothing else ----------------------------
listen_addresses = ''
# Persistent (not /var/run, emptied at boot) and owner-only.
unix_socket_directories = '@RUN_DIR@'
unix_socket_permissions = 0700
# The node's pool of 10 plus its writer-lock session, backup and restore, and a psql.
max_connections = 30

# ---- durability ---------------------------------------------------------------
# On macOS fsync() does not flush the drive's cache; F_FULLFSYNC does. Without it a power
# cut can lose transactions reported as committed.
wal_sync_method = fsync_writethrough

# ---- memory -------------------------------------------------------------------
shared_buffers = @SHARED_BUFFERS@
work_mem = @WORK_MEM@
maintenance_work_mem = @MAINTENANCE_WORK_MEM@
max_parallel_maintenance_workers = @MAX_PARALLEL_MAINTENANCE_WORKERS@

# ---- search -------------------------------------------------------------------
# pg_search registers a WAL resource manager and background workers: it must load at start.
shared_preload_libraries = 'pg_search'

# ---- logging ------------------------------------------------------------------
# A week of daily files in pgdata/log, each overwritten when its weekday comes round.
# launchd's StandardErrorPath only sees what is printed before the collector starts.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] %q%u@%d '

# ---- locale and time ----------------------------------------------------------
# Fixed, not inherited from whichever environment ran initdb.
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
datestyle = 'iso, mdy'
timezone = 'UTC'
log_timezone = 'UTC'
