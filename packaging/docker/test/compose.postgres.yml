# A throwaway Postgres for the integration suites, on 127.0.0.1:55432, with no volume.
# Its own project, so tearing it down cannot touch another stack.
name: stuga-test

services:
  postgres:
    build:
      context: ../../..
      dockerfile: packaging/docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: stuga
      POSTGRES_PASSWORD: stuga
      POSTGRES_DB: stuga_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stuga -d stuga_test"]
      interval: 3s
      timeout: 5s
      retries: 20
